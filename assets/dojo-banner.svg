<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kaizen DSA Dojo</title>
  <desc id="desc">An indigo coding dojo blueprint with a vermilion sun and torii gate made from code symbols.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c7d2fe" stroke-opacity=".075"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111b3d"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency=".8" numOctaves="3" seed="8" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#paper)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" filter="url(#grain)" opacity=".65"/>

  <g transform="translate(91 49)">
    <circle cx="128" cy="128" r="92" fill="#ef4444"/>
    <circle cx="128" cy="128" r="76" fill="none" stroke="#fca5a5" stroke-opacity=".33"/>
    <g fill="none" stroke="#fff7ed" stroke-linecap="square">
      <path d="M40 91h176M57 111h142" stroke-width="15"/>
      <path d="M77 106v113M179 106v113" stroke-width="13"/>
      <path d="M69 146h118" stroke-width="9"/>
    </g>
    <text x="128" y="250" fill="#fff7ed" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" text-anchor="middle" letter-spacing="6">改善</text>
  </g>

  <g transform="translate(376 66)">
    <text fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="4">THE CONTINUOUS IMPROVEMENT ARCHIVE</text>
    <text y="74" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">Kaizen DSA Dojo</text>
    <path d="M0 101h680" stroke="#fbbf24" stroke-width="2" opacity=".8"/>
    <text y="142" fill="#c7d2fe" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">UNDERSTAND  →  MODEL  →  IMPLEMENT  →  REFLECT</text>
    <g transform="translate(0 184)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">
      <rect width="194" height="42" rx="4" fill="#eef2ff" fill-opacity=".08" stroke="#818cf8" stroke-opacity=".45"/>
      <text x="20" y="27" fill="#e0e7ff">discipline / daily</text>
      <rect x="211" width="194" height="42" rx="4" fill="#eef2ff" fill-opacity=".08" stroke="#818cf8" stroke-opacity=".45"/>
      <text x="231" y="27" fill="#e0e7ff">patterns / durable</text>
      <rect x="422" width="194" height="42" rx="4" fill="#eef2ff" fill-opacity=".08" stroke="#818cf8" stroke-opacity=".45"/>
      <text x="442" y="27" fill="#e0e7ff">progress / honest</text>
    </g>
  </g>
</svg>
